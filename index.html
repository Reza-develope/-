<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemeliharaan Sistem - Kami Akan Segera Kembali</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Background Decorative Elements */
        .background-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: -10%;
            left: -10%;
            z-index: 1;
        }

        .background-glow-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.1) 0%, rgba(0,0,0,0) 70%);
            bottom: -10%;
            right: -10%;
            z-index: 1;
        }

        .container {
            max-width: 600px;
            width: 90%;
            text-align: center;
            padding: 40px;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
            animation: fadeIn 1s ease-out;
        }

        /* Maintenance Illustration / Icon */
        .icon-container {
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
        }

        .gear-svg {
            width: 80px;
            height: 80px;
            fill: #6366f1;
            animation: spin 8s linear infinite;
        }

        .gear-small {
            width: 45px;
            height: 45px;
            fill: #ec4899;
            position: absolute;
            bottom: -5px;
            right: -15px;
            animation: spin-reverse 6s linear infinite;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(to right, #818cf8, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        /* Progress Bar */
        .progress-container {
            background-color: rgba(15, 23, 42, 0.6);
            border-radius: 9999px;
            padding: 4px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .progress-bar {
            height: 12px;
            background: linear-gradient(to right, #6366f1, #ec4899);
            border-radius: 9999px;
            width: 0%; /* Default 0%, akan diatur otomatis oleh Javascript */
            transition: width 0.5s ease-out; /* Animasi transisi bar yang mulus */
        }

        .progress-text {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 8px;
            display: block;
            font-weight: 500;
        }

        /* Contact / Info Section */
        .footer-info {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 24px;
            font-size: 0.9rem;
            color: #64748b;
        }

        .footer-info a {
            color: #818cf8;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-info a:hover {
            color: #a5b4fc;
            text-decoration: underline;
        }

        /* Animations */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="background-glow"></div>
    <div class="background-glow-2"></div>

        <h1>Pemeliharaan Sistem</h1>
        <p>Kami sedang melakukan pemeliharaan rutin untuk meningkatkan performa dan layanan kami. Kami akan segera kembali dalam beberapa saat.</p>

        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
            <span id="progressLabel" class="progress-text">Proses pemeliharaan: Menghitung...</span>
        </div>

        <div class="footer-info">
            sabar ya minnasan...
        </div>
    </div>

    <script>
        // === PENGATURAN DURASI MAINTENANCE (Silakan Sesuaikan di Sini) ===
        // 1. Kapan maintenance dimulai?
        const waktuMulai = new Date("2026-07-17T16:42:00"); // Contoh: Mulai jam 12:00 siang
        
        // 2. Berapa jam durasi maintenance? (Misal: 4 jam)
        const durasiJam = 3;  
        
        // =================================================================

        // Menghitung waktu selesai otomatis berdasarkan durasi
        const waktuSelesai = new Date(waktuMulai.getTime() + (durasiJam * 60 * 60 * 1000));

        function perbaruiProgres() {
            const sekarang = new Date();
            
            // Total durasi maintenance dalam milidetik
            const totalDurasi = waktuSelesai - waktuMulai;
            // Waktu yang sudah berjalan dalam milidetik
            const waktuBerjalan = sekarang - waktuMulai;
            
            let persentase = 0;

            if (sekarang < waktuMulai) {
                // Jika belum waktunya mulai
                persentase = 0;
            } else if (sekarang >= waktuSelesai) {
                // Jika sudah melewati batas waktu selesai
                persentase = 100;
            } else {
                // Kalkulasi persentase real-time
                persentase = (waktuBerjalan / totalDurasi) * 100;
            }

            // Membulatkan angka persentase (misal: 65.4%)
            const persentaseBulat = persentase.toFixed(1);

            // Update ke tampilan HTML
            const progressBar = document.getElementById("progressBar");
            const progressLabel = document.getElementById("progressLabel");

            progressBar.style.width = persentaseBulat + "%";
            progressLabel.innerText = `Proses pemeliharaan: ${persentaseBulat}% selesai`;

            // Opsional: Jika sudah 100%, ubah teks info pendukung
            if (persentase >= 100) {
                progressLabel.innerText = "Pemeliharaan selesai! Sistem sedang menyinkronkan data...";
            }
        }

        // Jalankan fungsi setiap 1 detik (1000 milidetik) agar real-time
        perbaruiProgres(); // jalankan sekali saat pertama load
        setInterval(perbaruiProgres, 1000);
    </script>
</body>
</html>
