<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flash Card - Kanji N5</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #000; 
            color: #fff; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            overflow: hidden; 
            touch-action: none; /* Mencegah default scrolling agar swipe lancar */
        }
        
        .title {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-align: center;
        }

        #counter { margin-bottom: 15px; font-size: 14px; color: #666; letter-spacing: 2px; }

        .card-container { position: relative; width: 300px; height: 400px; perspective: 1000px; }
        .card { width: 100%; height: 100%; position: absolute; transform-style: preserve-3d; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s; cursor: pointer; visibility: hidden; opacity: 0; }
        .card.active { visibility: visible; opacity: 1; z-index: 2; }
        .card.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 2px solid #fff; border-radius: 15px; padding: 20px; text-align: center; }
        
        .card-front { background-color: #000; color: #fff; }
        .card-back { background-color: #fff; color: #000; transform: rotateY(180deg); }
        .text-main { font-size: 40px; font-weight: bold; margin-bottom: 10px; }
        .text-sub { font-size: 16px; color: #888; }
        .card-back .text-sub { color: #555; }

        /* Area Tombol Kontrol */
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            z-index: 10; /* Memastikan tombol berada di lapisan paling atas */
        }

        button {
            background-color: #000;
            color: #fff;
            border: 1px solid #fff;
            padding: 12px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.2s ease;
            touch-action: manipulation; /* Menghilangkan delay 300ms di browser mobile lama */
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            background-color: #fff;
            color: #000;
        }

        button.done-btn {
            border-color: #55ff55;
            color: #55ff55;
        }
        button.done-btn:active {
            background-color: #55ff55;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="title">Kanji N5 by Akatsuki no kurasu</div>
    <div id="counter">1 / 0</div>

    <div class="card-container" id="cardContainer">
        
        <div class="card">
            <div class="card-face card-front"><div class="text-main">私</div><div class="text-sub">Kanji</div></div>
            <div class="card-face card-back"><div class="text-main">わたし</div><div class="text-sub">Aku / Saya</div></div>
        </div>

        <div class="card">
            <div class="card-face card-front"><div class="text-main">先生</div><div class="text-sub">Kanji</div></div>
            <div class="card-face card-back"><div class="text-main">せんせい</div><div class="text-sub">Guru</div></div>
        </div>

        <div class="card">
            <div class="card-face card-front"><div class="text-main">猫</div><div class="text-sub">Kanji</div></div>
            <div class="card-face card-back"><div class="text-main">ねこ</div><div class="text-sub">Kucing</div></div>
        </div>

        <div class="card">
            <div class="card-face card-front"><div class="text-main">水</div><div class="text-sub">Kanji</div></div>
            <div class="card-face card-back"><div class="text-main">みず</div><div class="text-sub">Air</div></div>
        </div>

    </div>

    <div class="controls">
        <button id="shuffleBtn">🎲 Acak Kartu</button>
        <button id="doneBtn" class="done-btn">✅ Saya Sudah Hafal</button>
    </div>

    <script>
        const container = document.getElementById('cardContainer');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const doneBtn = document.getElementById('doneBtn');
        
        let allCards = Array.from(document.querySelectorAll('.card'));
        let activeCards = [...allCards]; 
        let currentIndex = 0;

        function updateDisplay() {
            if (activeCards.length === 0) {
                container.innerHTML = "<div style='text-align:center; margin-top:150px; font-weight:bold;'>🎉 すごい! Semua kartu sudah kamu hapal!, next ke part 2 letsgo🔥</div>";
                document.getElementById('counter').innerText = "0 / 0";
                shuffleBtn.style.display = 'none';
                doneBtn.style.display = 'none';
                return;
            }
            
            allCards.forEach(card => card.classList.remove('active', 'flipped'));
            activeCards[currentIndex].classList.add('active');
            document.getElementById('counter').innerText = `${currentIndex + 1} / ${activeCards.length}`;
        }

        // Logika Balik Kartu (Menggunakan Pointer Event untuk respons instan)
        allCards.forEach(card => {
            card.addEventListener('pointerdown', (e) => {
                // Mencegah trigger jika tidak sengaja tertekan saat swipe
                card.dataset.tapStartX = e.clientX;
                card.dataset.tapStartY = e.clientY;
            });

            card.addEventListener('pointerup', (e) => {
                const moveX = Math.abs(e.clientX - parseFloat(card.dataset.tapStartX || 0));
                const moveY = Math.abs(e.clientY - parseFloat(card.dataset.tapStartY || 0));
                
                // Jika posisi ketukan bergeser kurang dari 5px, anggap sebagai klik murni
                if (moveX < 5 && moveY < 5) {
                    card.classList.toggle('flipped');
                }
            });
        });

        // Logika Acak Urutan Kartu (Shuffle)
        function shuffleCards() {
            for (let i = activeCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [activeCards[i], activeCards[j]] = [activeCards[j], activeCards[i]];
            }
            currentIndex = 0; 
            updateDisplay();
        }

        // Logika Tombol "Saya Sudah Hafal"
        function markAsLearned() {
            if (activeCards.length === 0) return;
            
            activeCards.splice(currentIndex, 1);
            
            if (currentIndex >= activeCards.length && activeCards.length > 0) {
                currentIndex = activeCards.length - 1;
            }
            
            updateDisplay();
        }

        // --- SOLUSI ANTI DELAY: Menggunakan Pointer Events untuk Tombol ---
        // 'pointerdown' memicu fungsi langsung saat jari menyentuh layar, menghilangkan lag 300ms
        shuffleBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            shuffleCards();
        });

        doneBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            markAsLearned();
        });

        // Inisialisasi awal
        updateDisplay();

        // Logika Swipe menggunakan Hammer.js
        const h = new Hammer(container);
        h.get('swipe').set({ direction: Hammer.DIRECTION_VERTICAL });

        h.on('swipeup', () => {
            if (currentIndex < activeCards.length - 1) {
                currentIndex++;
                updateDisplay();
            }
        });

        h.on('swipedown', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateDisplay();
            }
        });
    </script>
</body>
</html>
