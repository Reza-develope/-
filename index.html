<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Belajar Bahasa Jepang kelas 赤月</title>
  <meta name="description" content="Flashcard bahasa Jepang dengan jadwal ulang pintar (FSRS-7), latihan pilihan ganda, dan latihan bunpou.">
  <meta name="theme-color" content="#f5f6fa" id="themeColor">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <!-- tema & versi ditetapkan sebelum halaman digambar supaya tidak berkedip -->
  <script>
    (function () {
      window.FC = window.FC || {};
      FC.BUILD = '2026.11.10';   // naikkan angka ini saat data/kode berubah (sw.js memakai versi yang sama)
      try {
        var s = JSON.parse(localStorage.getItem('fc.settings.v2') || '{}');
        if (s.theme === 'dark' || s.theme === 'light') document.documentElement.setAttribute('data-theme', s.theme);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main id="screens" tabindex="-1">
    <section class="screen" id="screen-home" aria-label="Beranda"></section>
    <section class="screen" id="screen-decks" aria-label="Deck"></section>
    <section class="screen" id="screen-practice" aria-label="Latihan"></section>
    <section class="screen" id="screen-stats" aria-label="Statistik"></section>
    <section class="screen" id="screen-settings" aria-label="Pengaturan"></section>
  </main>
  <nav class="tabbar" id="tabbar" aria-label="Navigasi utama"></nav>
  <div id="layers"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:24px;font-family:sans-serif">Aplikasi ini membutuhkan JavaScript. Aktifkan JavaScript di browser lalu muat ulang halaman.</p></noscript>

  <!-- data kecil di awal; isi kartu & soal diunduh per deck saat dibutuhkan -->
  <script src="data/manifest.js"></script>
  <script src="data/locks.js"></script>
  <!-- inti -->
  <script src="js/core/util.js"></script>
  <script src="js/core/fsrs.js"></script>
  <script src="js/core/scheduler.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/data.js"></script>
  <script src="js/core/session.js"></script>
  <script src="js/core/userdecks.js"></script>   <!-- "Deck Saya": deck buatan pengguna (disimpan di browser, ikut cadangan) -->
  <script src="js/core/furigana-data.js"></script>
  <script src="js/core/furigana.js"></script>
  <script src="js/core/tts.js"></script>
  <!-- antarmuka -->
  <script src="js/ui/kit.js"></script>
  <script src="js/ui/cardface.js"></script>
  <script src="js/ui/app.js"></script>   <!-- kerangka + rute; layar di bawah mendaftar ke FC.app -->
  <script src="js/ui/home.js"></script>
  <script src="js/ui/decks.js"></script>
  <script src="js/ui/mydecks.js"></script>   <!-- editor "Deck Saya": bikin deck, tambah/ubah kartu, tempel banyak, bagikan -->
  <script src="js/ui/study.js"></script>
  <script src="js/ui/practice.js"></script>
  <script src="js/ui/stats.js"></script>
  <script src="js/ui/settings.js"></script>
</body>
</html>
