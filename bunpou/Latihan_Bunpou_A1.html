<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Latihan Bunpou A1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F6;--card:#fff;--ink:#16213B;--mute:#5C6882;--line:#D8DEEA;--soft:#E7ECF4;--brand:#243F7A;--onbrand:#fff;
--ok:#17714F;--okbg:#E2F2EA;--ng:#B1451B;--ngbg:#FBEAE0;--warn:#7D5B00;--warnbg:#FAEFC8;--seal:#B3202A;
--font:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0E1424;--card:#161E33;--ink:#E8EDF8;--mute:#9AA6C0;--line:#2B3656;--soft:#202A47;--brand:#86A6F2;--onbrand:#0E1424;
--ok:#5ED3A2;--okbg:#12332A;--ng:#FF9C70;--ngbg:#3A2218;--warn:#F0CA5C;--warnbg:#39300F;--seal:#E8545A}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--font)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(48px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
ruby rt{font-size:.5em;font-weight:500;color:var(--mute);letter-spacing:0}
.nofuri rt{display:none}
[hidden]{display:none!important}
/* header */
.top{padding:calc(20px + env(safe-area-inset-top)) 0 4px}
.brand{display:flex;align-items:center;gap:14px}
.lvl{flex:none;min-width:58px;height:58px;padding:0 8px;border:3px solid var(--ink);border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:21px;letter-spacing:-.01em}
.ttl{flex:1;min-width:0}
h1{margin:0;font-size:21px;line-height:1.3;font-weight:900}
.sub{font-size:13px;color:var(--mute)}
.furi{flex:none;min-height:36px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:13.5px;font-weight:700}
.furi[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{margin-top:16px;height:9px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .3s}
#bp{background:var(--ok)}#bn{background:#E0B43A}
.proglbl{margin-top:6px;font-size:13px;color:var(--mute)}
/* home */
.ctrl{display:grid;gap:10px;margin:16px 0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:12px;border:2px solid var(--brand);background:var(--brand);color:var(--onbrand);font-weight:700}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.search{width:100%;min-height:46px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lesson{margin:22px 0}
.lh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:0 2px 10px}
.lh h2{margin:0;font-size:17px;line-height:1.5;font-weight:900}
.tp{font-size:12.5px;color:var(--mute);line-height:1.6}
.mini{flex:none;min-height:36px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:13.5px;font-weight:700}
.items{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.it{border-top:1px solid var(--line)}
details.it:first-child{border-top:0}
summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"";flex:none;width:8px;height:8px;margin:0 2px 3px 2px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .15s}
details[open]>summary::after{transform:rotate(-135deg);margin-bottom:-3px}
.pat{flex:1;min-width:0;font-weight:700;line-height:2;overflow-wrap:anywhere}
.tag{flex:none;font-size:12px;font-weight:700;line-height:1.5;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--mute);white-space:nowrap}
.tag.pass{background:var(--okbg);color:var(--ok)}.tag.near{background:var(--warnbg);color:var(--warn)}.tag.retry{background:var(--ngbg);color:var(--ng)}
.det{padding:0 14px 14px}
.ex{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:15px;line-height:2.1}
.rum{margin:10px 0 0;font-size:14px;color:var(--mute);line-height:1.8}
.go{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:13px;color:var(--mute)}
.empty{text-align:center;color:var(--mute);padding:28px 0}
.foot{margin:28px 0 0;font-size:12.5px;color:var(--mute);line-height:1.7}
.link{border:0;background:none;padding:0;color:var(--brand);text-decoration:underline;font-size:inherit}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 0 10px}
.x{flex:none;width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:17px}
.qbar{flex:1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--brand);transition:width .25s}
.qn{flex:none;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.ctx{margin:2px 2px 10px;font-size:13.5px;font-weight:700;color:var(--mute);line-height:1.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px 16px}
.qt{display:inline-block;margin-bottom:8px;padding:1px 10px;border-radius:99px;background:var(--soft);color:var(--mute);font-size:12px;font-weight:700}
.stem{font-size:20px;line-height:2.1;font-weight:500;overflow-wrap:anywhere}
.stem.sm{font-size:17px}
.nofuri .stem{line-height:1.8}.nofuri .pat,.nofuri .ex{line-height:1.7}
.inq .top{padding-top:calc(12px + env(safe-area-inset-top))}.inq .bar,.inq .proglbl,.inq .sub{display:none}.inq .lvl{min-width:42px;height:42px;font-size:16px;border-width:2.5px;border-radius:11px}.inq h1{font-size:17px}
.dir{display:inline-block;font-size:14.5px;line-height:1.7;color:var(--mute);font-weight:500}
.bl{display:inline-block;min-width:3.4em;margin:0 .2em;border-bottom:2.5px solid var(--ink);text-align:center;line-height:1.3;vertical-align:baseline}
.bl:empty{height:1.1em}
.bl.ok{border-color:var(--ok);color:var(--ok);font-weight:700}
.inl{width:8em;max-width:100%;margin:0 .2em;padding:0 .3em;border:0;border-bottom:2.5px solid var(--brand);border-radius:6px 6px 0 0;background:var(--soft);color:var(--ink);font:inherit;text-align:center}
.inl:focus,.ans:focus{outline:none;background:var(--card);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 30%,transparent)}
.ans{display:block;width:100%;margin-top:14px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-size:20px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:18px;line-height:1.9;text-align:left}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--mute);line-height:1}
.opt:not(:disabled):hover{border-color:var(--brand)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ng{border-color:var(--ng);background:var(--ngbg)}
.opt:disabled{cursor:default;color:var(--ink)}
.zone{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;min-height:68px;margin-top:14px;padding:10px;border:2px dashed var(--line);border-radius:12px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tile{padding:6px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:18px;line-height:1.9;box-shadow:0 2px 0 var(--line)}
.zone .tile{border-color:var(--brand)}
.tile:disabled{cursor:default;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.fb{margin-top:16px;padding:14px 16px;border-radius:14px;border:1.5px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}.fb.ng{background:var(--ngbg);border-color:var(--ng)}
.fb h3{margin:0 0 4px;font-size:17px;line-height:1.5}
.fb.ok h3{color:var(--ok)}.fb.ng h3{color:var(--ng)}
.fb p,.rv p{margin:6px 0 0;font-size:15px;line-height:1.9}
.al{margin:4px 0;font-size:16px;line-height:2}
.nx{margin-top:14px}
/* result */
.res{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-top:calc(18px + env(safe-area-inset-top))}
.score{display:flex;align-items:center;justify-content:space-between;gap:16px}
.big{font-size:56px;font-weight:900;line-height:1.1}
.big small{font-size:24px;color:var(--mute);font-weight:700}
.msg{margin-top:6px;font-size:15.5px;line-height:1.7}
.seal{flex:none;width:88px;height:88px;display:grid;place-items:center;border:4px solid var(--seal);border-radius:12px;color:var(--seal);font-size:32px;font-weight:900;line-height:1;letter-spacing:.06em;writing-mode:vertical-rl;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 5px var(--seal);transform:rotate(-7deg);animation:stamp .55s cubic-bezier(.2,1.5,.35,1) both}
@keyframes stamp{0%{transform:rotate(-7deg) scale(2.4);opacity:0}55%{opacity:1}100%{transform:rotate(-7deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.seal{animation:none}.bar i,.qbar i{transition:none}}
.res ul{list-style:none;margin:16px 0 0;padding:0}
.res li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.res li .jp{flex:1;min-width:0;font-weight:700;line-height:2}
.sc{flex:none;font-variant-numeric:tabular-nums;font-weight:700}
.rv h2{margin:26px 2px 0;font-size:17px}
.rv article{margin-top:12px;padding:12px 14px;border:1px solid var(--line);border-left:5px solid var(--ng);border-radius:12px;background:var(--card)}
.allok{margin:22px 2px;color:var(--ok);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="lvl" aria-hidden="true">A1</div>
      <div class="ttl"><h1>Latihan Bunpou</h1><div class="sub jp">いろどり 入門</div></div>
      <button id="furi" class="furi jp" aria-pressed="true" title="Tampilkan / sembunyikan furigana">ふりがな</button>
    </div>
    <div class="bar" aria-hidden="true"><i id="bp"></i><i id="bn"></i></div>
    <div class="proglbl" id="plabel"></div>
  </header>
  <main id="app"></main>
</div>
<noscript><p style="padding:16px">Halaman ini membutuhkan JavaScript.</p></noscript>
<script>

(function () {
'use strict';
const D = DATA, KEY = 'bunpou:' + D.id;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const app = $('#app');

let store = {items: {}, furi: true};
try { const raw = JSON.parse(localStorage.getItem(KEY)); if (raw && typeof raw === 'object') { store.items = raw.items || {}; if (typeof raw.furi === 'boolean') store.furi = raw.furi; } } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };

const ITEMS = [], BYID = {}, LES = {};
D.lessons.forEach(l => { LES[l.n] = l; l.items.forEach(it => { it.l = l; ITEMS.push(it); BYID[it.id] = it; }); });

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const kata2hira = s => s.replace(/[\u30A1-\u30F6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const norm = s => kata2hira(String(s).normalize('NFKC')).toLowerCase().replace(/[\s。、，．,.!！?？「」『』（）()・~～〜…\-]/g, '');

const need = n => n - Math.floor(n / 5);
function stOf(it) {
  const r = store.items[it.id], n = it.qs.length;
  if (!r || r.n !== n) return 'new';
  if (r.c >= need(n)) return 'pass';
  if (n >= 3 && r.c / n >= 0.6) return 'near';
  return 'retry';
}
const ST = {new: 'Belum dicoba', pass: 'Kuasai', near: 'Hampir', retry: 'Perlu diulang'};

let view = 'home', S = null, fil = 'all';

function updateSummary() {
  const t = ITEMS.length, p = ITEMS.filter(i => stOf(i) === 'pass').length, n = ITEMS.filter(i => stOf(i) === 'near').length;
  $('#bp').style.width = (p / t * 100) + '%';
  $('#bn').style.width = (n / t * 100) + '%';
  $('#plabel').textContent = p + ' dari ' + t + ' bunpou dikuasai' + (n ? ' · ' + n + ' hampir' : '');
}

/* ---------- home ---------- */
function itemHTML(it) {
  const st = stOf(it), n = it.qs.length;
  return `<details class="it" data-id="${it.id}" data-st="${st}" data-k="${esc(it.k)}">
<summary><span class="pat jp">${it.pat}</span><span class="tag ${st}">${ST[st]}</span></summary>
<div class="det">${it.ex ? `<div class="ex jp">${it.ex}</div>` : ''}${it.rum ? `<p class="rum jp">${it.rum}</p>` : ''}
<div class="go"><span>${n} soal · kuasai jika benar ${need(n)}/${n}</span><button class="btn" data-act="item" data-id="${it.id}">Mulai tes</button></div></div></details>`;
}
function home() {
  view = 'home'; S = null; document.body.classList.remove('inq'); window.scrollTo(0, 0);
  const lessons = D.lessons.map(l => {
    const nq = l.items.reduce((a, i) => a + i.qs.length, 0), ps = l.items.filter(i => stOf(i) === 'pass').length;
    return `<section class="lesson"><div class="lh"><div><h2 class="jp">第${l.n}課　${l.t}</h2>
<div class="tp jp">${l.topic} ・ ${l.items.length} bunpou ・ ${nq} soal ・ ${ps}/${l.items.length} kuasai</div></div>
<button class="mini" data-act="lesson" data-n="${l.n}">Tes 課</button></div><div class="items">${l.items.map(itemHTML).join('')}</div></section>`;
  }).join('');
  const chips = [['all', 'Semua'], ['new', 'Belum'], ['retry', 'Perlu diulang'], ['near', 'Hampir'], ['pass', 'Kuasai']]
    .map(([k, v]) => `<button class="chip" data-act="chip" data-f="${k}" aria-pressed="${fil === k}">${v}</button>`).join('');
  app.innerHTML = `<div class="ctrl"><button class="btn block" data-act="mix">Latihan campuran · 15 soal</button>
<input id="q" class="search" type="search" placeholder="Cari bunpou (mis. てください, あげます)" autocomplete="off" aria-label="Cari bunpou">
<div class="chips" role="group" aria-label="Filter status">${chips}</div></div>${lessons}
<p id="none" class="empty" hidden>Tidak ada bunpou yang cocok.</p>
<p class="foot">Kuasai = benar sedikitnya 80% dari soal bunpou itu (bunpou dengan 1–4 soal harus benar semua). Progres tersimpan di browser ini. <button class="link" data-act="reset">Reset progres</button></p>`;
  applyFilter(); updateSummary();
}

    let vis = 0;
    $$('details.it', sec).forEach(d => {
      const ok = (fil === 'all' || d.dataset.st === fil) && (!q || d.dataset.k.includes(q));
      d.hidden = !ok; if (ok) vis++;
    });
    sec.hidden = !vis; if (vis) any = true;
  });
  const none = $('#none'); if (none) none.hidden = any;
}

/* ---------- sessions ---------- */
function begin(o) { S = Object.assign({i: 0, results: [], done: false, full: false, ctx: true}, o); view = 'quiz'; document.body.classList.add('inq'); showQ(); }
const qsOf = it => it.qs.map(q => ({q, it}));
function startItem(id) { begin({mode: 'item', queue: qsOf(BYID[id]), full: true, scope: {type: 'item', id}}); }
function startLesson(n) { begin({mode: 'lesson', queue: LES[n].items.flatMap(qsOf), full: true, scope: {type: 'lesson', n}}); }
function startMix() {
  let pool = ITEMS.filter(i => stOf(i) !== 'pass'); if (pool.length < 4) pool = ITEMS;
  begin({mode: 'mix', queue: shuffle(pool.flatMap(qsOf)).slice(0, 15), ctx: false, scope: {type: 'mix'}});
}
function startWrong() {
  const queue = shuffle(S.results.filter(r => !r.ok).map(r => ({q: r.q, it: r.it})));
  begin({mode: 'retry', queue, ctx: S.ctx, scope: S.scope});
}
function restart() { const sc = S.scope; if (sc.type === 'item') startItem(sc.id); else if (sc.type === 'lesson') startLesson(sc.n); else startMix(); }

const correctOf = q => q.y === 'm' ? q.o[0] : q.y === 't' ? q.d : q.k.join('');

function showQ() {
  const {q, it} = S.queue[S.i], total = S.queue.length;
  S.done = false; S.placed = []; window.scrollTo(0, 0);
  const lbl = {m: 'Pilihan ganda', t: 'Ketik jawaban', o: 'Susun kalimat'}[q.y];
  let stem = q.s, body = '';
  if (q.y === 'm') {
    S.ord = shuffle(q.o.map((_, i) => i));
    body = `<div class="opts">${S.ord.map((oi, n) => `<button class="opt" data-act="opt" data-i="${oi}"><span class="k">${n + 1}</span><span class="jp">${q.o[oi]}</span></button>`).join('')}</div>`;
  } else if (q.y === 't') {
    const inl = stem.includes('class="bl"');
    const inp = `<input id="in" class="${inl ? 'inl' : 'ans'}" type="text" lang="ja" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Jawabanmu">`;
    if (inl) stem = stem.replace('<span class="bl"></span>', inp); else body = inp;
    body += `<div class="row"><button class="btn" data-act="check">Cek jawaban</button><button class="btn ghost" data-act="giveup">Tidak tahu</button></div>`;
  } else {
    let ord, tries = 0;
    do { ord = shuffle(q.k.map((_, i) => i)); tries++; } while (tries < 20 && ord.every((v, i) => v === i));
    S.pool = ord;
    body = `<div class="zone" id="zone" aria-label="Susunan jawabanmu"></div><div class="pool" id="pool"></div>
<div class="row"><button class="btn" id="chk" data-act="check" disabled>Cek jawaban</button><button class="btn ghost" data-act="clear">Ulang susun</button><button class="btn ghost" data-act="giveup">Tidak tahu</button></div>`;
  }
  app.innerHTML = `<div class="qtop"><button class="x" data-act="quit" aria-label="Keluar dari tes">✕</button><div class="qbar"><i style="width:${S.i / total * 100}%"></i></div><span class="qn">${S.i + 1}/${total}</span></div>
${S.ctx ? `<div class="ctx jp">${it.pat}</div>` : ''}
<div class="card"><span class="qt">${lbl}</span><div class="stem jp" id="stem">${stem}</div>${body}<div id="fb" aria-live="polite"></div></div>`;
  if (q.y === 'o') drawTiles();
  if (q.y === 't') { const el = $('#in'); if (el) el.focus(); }
}

function drawTiles() {
  const q = S.queue[S.i].q, mk = i => `<button class="tile jp" data-act="tile" data-i="${i}">${q.k[i]}</button>`;
  $('#zone').innerHTML = S.placed.map(mk).join('');
  $('#pool').innerHTML = S.pool.filter(i => !S.placed.includes(i)).map(mk).join('');
  $('#chk').disabled = S.placed.length !== q.k.length;
}
function tileClick(el) {
  if (S.done) return; const i = +el.dataset.i;
  S.placed = S.placed.includes(i) ? S.placed.filter(x => x !== i) : S.placed.concat(i);
  drawTiles();
}

function fillInput(q) {
  const inp = $('#in'); if (!inp) return;
  if (inp.classList.contains('inl')) { const sp = document.createElement('span'); sp.className = 'bl ok'; sp.innerHTML = q.d; inp.replaceWith(sp); } else inp.disabled = true;
}
function answerM(i) {
  if (S.done) return; S.done = true;
  const q = S.queue[S.i].q;
  $$('.opt').forEach(b => { b.disabled = true; const oi = +b.dataset.i; if (oi === 0) b.classList.add('ok'); else if (oi === i) b.classList.add('ng'); });
  const bl = $$('#stem .bl');
  if (bl.length) { const parts = bl.length > 1 ? q.o[0].split('／') : [q.o[0]]; bl.forEach((b, k) => { b.innerHTML = parts[k] || ''; b.classList.add('ok'); }); }
  finishQ(i === 0, q.o[i], '');
}
function checkAnswer() {
  if (S.done) return; const q = S.queue[S.i].q;
  if (q.y === 't') {
    const inp = $('#in'), v = inp.value;
    if (!norm(v)) { inp.focus(); return; }
    const ok = q.a.some(a => norm(a) === norm(v));
    S.done = true; fillInput(q);
    finishQ(ok, esc(v), ok ? '' : `<div class="al">Jawabanmu: <b>${esc(v)}</b></div><div class="al">Yang benar: <b class="jp">${q.d}</b></div>`);
  } else if (q.y === 'o') {
    if (S.placed.length !== q.k.length) return;
    const joined = S.placed.map(i => q.p[i]).join(''), ok = q.acc.some(a => norm(a) === norm(joined));
    S.done = true; $$('.tile').forEach(t => t.disabled = true);
    finishQ(ok, S.placed.map(i => q.k[i]).join(''), ok ? '' : `<div class="al">Yang benar: <b class="jp">${q.k.join('')}</b></div>`);
  }
}
function giveUp() {
  if (S.done) return; const q = S.queue[S.i].q; S.done = true;
  fillInput(q); $$('.tile').forEach(t => t.disabled = true);
  finishQ(false, '<i>(tidak dijawab)</i>', `<div class="al">Yang benar: <b class="jp">${correctOf(q)}</b></div>`);
}
function finishQ(ok, given, extra) {
  const {q, it} = S.queue[S.i], last = S.i + 1 >= S.queue.length;
  S.results.push({q, it, ok, given});
  $$('.row').forEach(r => r.hidden = true);
  $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'ng'}" role="status"><h3>${ok ? '〇 Benar!' : '× Belum tepat'}</h3>${extra}<p class="jp">${q.e}</p></div>
<button class="btn block nx" data-act="next">${last ? 'Lihat hasil' : 'Lanjut'}</button>`;
  const nx = $('.nx'); nx.focus({preventScroll: true}); nx.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}
function next() { if (S.i + 1 >= S.queue.length) result(); else { S.i++; showQ(); } }

/* ---------- result ---------- */
function result() {
  view = 'result'; window.scrollTo(0, 0);
  const R = S.results, n = R.length, c = R.filter(r => r.ok).length, by = new Map();
  R.forEach(r => { let o = by.get(r.it.id); if (!o) { o = {it: r.it, c: 0, n: 0}; by.set(r.it.id, o); } o.n++; if (r.ok) o.c++; });
  if (S.full) { by.forEach(o => { if (o.n === o.it.qs.length) store.items[o.it.id] = {c: o.c, n: o.n, t: Date.now()}; }); save(); }
  updateSummary();
  let head;
  if (S.mode === 'item') {
    const st = stOf(S.queue[0].it);
    const msg = {pass: 'Kuasai! Kamu sudah paham bunpou ini.', near: 'Hampir! Tinggal sedikit lagi. Baca penjelasan soal yang salah, lalu ulangi.', retry: 'Belum kuasai. Baca penjelasan di bawah, lalu coba lagi.'}[st];
    head = `<div class="score"><div><div class="big">${c}<small>/${n}</small></div><div class="msg">${msg}</div></div>${st === 'pass' ? '<div class="seal" aria-hidden="true">習得</div>' : ''}</div>`;
  } else {
    const list = [...by.values()], passed = S.full ? list.filter(o => stOf(o.it) === 'pass').length : 0;
    const rows = list.map(o => `<li><span class="jp">${o.it.pat}</span><span class="sc">${o.c}/${o.n}</span>${S.full ? `<span class="tag ${stOf(o.it)}">${ST[stOf(o.it)]}</span>` : ''}</li>`).join('');
    head = `<div class="score"><div><div class="big">${c}<small>/${n}</small></div><div class="msg">${S.full ? passed + ' dari ' + list.length + ' bunpou kuasai.' : 'Latihan ini tidak mengubah status kuasai.'}</div></div></div><ul>${rows}</ul>`;
  }
  const wrong = R.filter(r => !r.ok);
  const review = wrong.length ? `<div class="rv"><h2>Perlu dipelajari lagi (${wrong.length})</h2>${wrong.map(r => `<article>${S.mode !== 'item' ? `<div class="ctx jp">${r.it.pat}</div>` : ''}<div class="stem sm jp">${r.q.s}</div>
<div class="al">Jawabanmu: <b class="jp">${r.given}</b></div><div class="al">Yang benar: <b class="jp">${correctOf(r.q)}</b></div><p class="jp">${r.q.e}</p></article>`).join('')}</div>` : '<p class="allok">Semua jawaban benar.</p>';
  app.innerHTML = `<div class="res">${head}</div>${review}
<div class="row">${wrong.length ? `<button class="btn" data-act="wrong">Ulangi yang salah (${wrong.length})</button>` : ''}<button class="btn ghost" data-act="again">Tes ulang</button><button class="btn ghost" data-act="home">Kembali ke daftar</button></div>`;
}

/* ---------- events ---------- */
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  switch (el.dataset.act) {
    case 'item': startItem(+el.dataset.id); break;
    case 'lesson': startLesson(+el.dataset.n); break;
    case 'mix': startMix(); break;
    case 'chip': fil = el.dataset.f; $$('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.f === fil)); applyFilter(); break;
    case 'reset': if (confirm('Hapus semua progres di browser ini?')) { store.items = {}; save(); home(); } break;
    case 'quit': if (!S.results.length || confirm('Keluar dari tes? Sesi ini tidak akan disimpan.')) home(); break;
    case 'opt': answerM(+el.dataset.i); break;
    case 'tile': tileClick(el); break;
    case 'clear': if (!S.done) { S.placed = []; drawTiles(); } break;
    case 'check': checkAnswer(); break;
    case 'giveup': giveUp(); break;
    case 'next': next(); break;
    case 'wrong': startWrong(); break;
    case 'again': restart(); break;
    case 'home': home(); break;
  }
});
app.addEventListener('input', e => { if (e.target.id === 'q') applyFilter(); });
document.addEventListener('keydown', e => {
  if (view !== 'quiz' || !S || e.isComposing || e.keyCode === 229) return;
  const q = S.queue[S.i].q;
  if (e.key === 'Enter') {
    if (S.done) { e.preventDefault(); next(); }
    else if (q.y === 't' || (q.y === 'o' && S.placed.length === q.k.length)) { e.preventDefault(); checkAnswer(); }
  } else if (q.y === 'm' && !S.done && /^[1-5]$/.test(e.key)) {
    const b = $$('.opt')[+e.key - 1]; if (b) b.click();
  }
});
const fb = $('#furi');
function setFuri() { document.body.classList.toggle('nofuri', !store.furi); fb.setAttribute('aria-pressed', String(store.furi)); }
fb.addEventListener('click', () => { store.furi = !store.furi; save(); setFuri(); });
setFuri(); home();
})();
</script>
</body>
</html>
